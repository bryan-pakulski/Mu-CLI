name: Durable engineering jobs

on:
  push:
    branches:
      - main

jobs:
  durable-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # tests/jobs includes the Docker suites: Docker is mandatory (documentation/testing/harness.md);
      # the first run builds the mucli-job-runtime image from this tree.
      - name: Run durable jobs tests
        env:
          MUCLI_HOME: ${{ runner.temp }}/mucli-test
          PYTHONPATH: .
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short tests/jobs \
            2>&1 | tee "${RUNNER_TEMP}/durable-jobs-pytest.log"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-jobs-pytest
          path: ${{ runner.temp }}/durable-jobs-pytest.log
          if-no-files-found: ignore

  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/android/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile durable-work surfaces
        run: npm run typecheck
