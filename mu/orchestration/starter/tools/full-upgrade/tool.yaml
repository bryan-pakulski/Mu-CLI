id: os.full-upgrade
title: Upgrade all packages
summary: Refresh the package lists and upgrade every package (apt, dnf/yum, zypper, pacman or apk). Never removes packages unless allow_removals is set. Check mode lists what would be upgraded.
category: maintenance
effect: mutating
idempotent: true
targets: {requires: [systemd]}
privilege: {run_as: root}
inputs:
  type: object
  properties:
    allow_removals: {type: boolean, default: false, description: "Allow upgrades that remove or replace packages (apt full-upgrade, dnf --allowerasing)"}
  additionalProperties: false
outputs:
  type: object
  properties:
    manager: {type: [string, "null"]}
    check_mode: {type: boolean}
    count: {type: integer}
    packages: {type: array, items: {type: string}}
    removals_allowed: {type: boolean}
    reboot_required: {type: boolean}
  required: [manager, check_mode, count, packages, removals_allowed, reboot_required]
implementation: {runtime: python3, entry: full_upgrade.py, check_mode: true}
limits: {timeout_s: 7200, max_output_kb: 512, memory_mb: 1024}
