<aside class="mode-panel"
       data-mode="feature"
       x-show="$store.mode.active === 'feature'"
       x-transition.opacity.duration.200ms>

    {% with shell_mode="feature" %}{% include "fragments/mode_shell.html" %}{% endwith %}

    <div class="panel-empty w-empty" data-size="sm" data-tone="plan"
         x-show="$store.feature.loaded && !$store.feature.plan()">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-layers"></use></svg></div>
        <h3 class="w-empty__title">Plan a feature</h3>
        <p class="w-empty__body">Describe the feature in chat. The agent proposes a plan with exit
        criteria; you approve it before any code changes.</p>
    </div>

    <template x-if="$store.feature.plan()">
        <div class="mode-body" role="tabpanel">
            <!-- Plan: phases → tasks; the board opens in the expanded view -->
            <section class="w-group" x-show="$store.feature.tab === 'Plan'">
                <p class="mode-goal" x-text="$store.feature.plan().feature_request"></p>
                <template x-for="phase in $store.feature.phases()" :key="phase.id">
                    <div class="w-group">
                        <h3 class="w-group__title" x-text="phase.title"></h3>
                        <ul class="w-rows">
                            <template x-for="t in phase.tasks" :key="t.id">
                                <li class="w-row" x-data="{ r: $store.feature.taskRow(t) }">
                                    <span class="w-sign" :data-status="r.status" aria-hidden="true" x-text="r.glyph"></span>
                                    <button type="button" class="w-row__main" @click="$store.feature.openTask(t)">
                                        <span class="w-row__title" x-text="r.title"></span>
                                        <span class="w-row__sub" x-text="r.sub"></span>
                                    </button>
                                    <span class="w-row__actions">
                                        <button type="button" class="w-textbtn"
                                                x-show="t.status === 'not_started' && $store.feature.plan().approval && !$store.feature.plan().current_task"
                                                @click.stop="$store.feature.startTask(t)">Start</button>
                                        <button type="button" class="w-textbtn" data-tone="danger"
                                                x-show="t.status === 'in_progress' && t.unmet.length"
                                                @click.stop="$store.feature.override(t)">Override…</button>
                                    </span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <button type="button" class="w-textbtn" @click="$store.modeExpand.open('feature', null)">Expand board</button>
            </section>

            <!-- Tasks: the current task and its criteria -->
            <section class="w-group" x-show="$store.feature.tab === 'Tasks'">
                <template x-for="t in ($store.feature.plan().tasks || []).filter(t => t.status === 'in_progress' || t.status === 'blocked')" :key="t.id">
                    <div class="w-group">
                        <h3 class="w-group__title" x-text="'t' + t.id + ' ' + t.title"></h3>
                        <p class="w-row__sub" x-text="t.objective"></p>
                        <ul class="w-rows">
                            <template x-for="c in t.criteria" :key="c.id">
                                <li class="w-row" x-data="{ s: window.MuModes.vstyle('criterion', window.MuModeModels.feature.criterionKey(c)) }">
                                    <span class="w-sign" :data-status="s.status" aria-hidden="true" x-text="s.glyph"></span>
                                    <div class="w-row__main">
                                        <span class="w-row__title" x-text="c.id + ' ' + c.text"></span>
                                        <span class="w-row__sub" x-text="s.label + (c.check ? ' · ' + c.check.command : '')"></span>
                                    </div>
                                    <span class="w-row__actions">
                                        <button type="button" class="w-textbtn" x-show="!c.met" @click.stop="$store.feature.attest(t, c)">Mark met…</button>
                                    </span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <p class="w-group__empty"
                   x-show="!($store.feature.plan().tasks || []).some(t => t.status === 'in_progress' || t.status === 'blocked')">No task in progress.</p>
            </section>

            <!-- Criteria: every criterion with its evidence mark -->
            <section class="w-group" x-show="$store.feature.tab === 'Criteria'">
                <ul class="w-rows">
                    <template x-for="row in $store.feature.criteria()" :key="row.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="row.status" aria-hidden="true" x-text="row.glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.feature.openTask(row.task)">
                                <span class="w-row__title" x-text="row.c.text"></span>
                                <span class="w-row__sub" x-text="'t' + row.task.id + ' · ' + row.label"></span>
                            </button>
                        </li>
                    </template>
                </ul>
            </section>

            <!-- Reviews and what blocks completion -->
            <section class="w-group" x-show="$store.feature.tab === 'Reviews'">
                <ul class="w-rows">
                    <template x-for="r in $store.feature.reviews()" :key="r.id">
                        <li class="w-row">
                            <span class="w-sign" data-status="done" aria-hidden="true">✓</span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="'t' + r.task_id + ' · ' + r.summary"></span>
                                <span class="w-row__sub" x-text="'check ' + r.check_run + ((r.issues || []).length ? ' · ' + r.issues.length + ' issues' : '')"></span>
                            </div>
                            <span class="w-row__actions"><button type="button" class="w-textbtn" @click.stop="$store.feature.openRun(r.check_run)">Run</button></span>
                        </li>
                    </template>
                </ul>
                <p class="w-group__empty" x-show="!$store.feature.reviews().length">No reviews yet.</p>
                <template x-if="($store.feature.plan().completion_gaps || []).length && $store.feature.plan().status !== 'draft'">
                    <div>
                        <h3 class="w-group__title">Before completion</h3>
                        <ul><template x-for="g in $store.feature.plan().completion_gaps" :key="g"><li x-text="g"></li></template></ul>
                    </div>
                </template>
            </section>
        </div>
    </template>

    <details class="w-disclose" x-show="($store.feature.state.features || []).length">
        <summary>Features</summary>
        <ul class="w-rows">
            <template x-for="f in ($store.feature.state.features || [])" :key="f.feature_id">
                <li class="w-row">
                    <span class="w-sign" :data-status="window.MuModes.vstyle('feature_plan', f.status).status" aria-hidden="true"
                          x-text="window.MuModes.vstyle('feature_plan', f.status).glyph"></span>
                    <div class="w-row__main">
                        <span class="w-row__title" x-text="f.feature_name"></span>
                        <span class="w-row__sub" x-text="window.MuModes.vstyle('feature_plan', f.status).label + (f.task_count ? ' · ' + f.completed_count + ' of ' + f.task_count : '') + (f.archived ? ' · archived' : '')"></span>
                    </div>
                    <span class="w-row__actions">
                        <button type="button" class="w-textbtn" x-show="!f.is_active && !f.archived" @click.stop="$store.feature.loadFeature(f.feature_id)">Load</button>
                    </span>
                </li>
            </template>
        </ul>
    </details>
</aside>
