<aside class="mode-panel"
       data-mode="systemPrompts"
       x-show="$store.mode.active === 'systemPrompts'"
       x-transition.opacity.duration.200ms>

    <!-- empty state when no prompts loaded -->
    <div class="panel-empty w-empty" data-size="sm" data-tone="accent" x-show="!$store.systemPrompts.items.length && !$store.systemPrompts.loading">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-file-text"></use></svg></div>
        <h3 class="w-empty__title">System prompts</h3>
        <p class="w-empty__body">No prompts loaded. Click reload to fetch from the
        backend API.</p>
    </div>

    <!-- header -->
    <div class="panel-head" x-show="$store.systemPrompts.items.length">
        <div class="panel-subject">System prompts</div>
        <div class="panel-meta">
            <span x-text="$store.systemPrompts.items.length + ' prompts'"></span>
            <span x-show="$store.systemPrompts.selected"
                  x-text="' · ' + $store.systemPrompts.selected"></span>
        </div>
    </div>

    <!-- prompt list -->
    <section class="panel-section w-panel__section"
             x-show="$store.systemPrompts.items.length"
             :class="{ open: $store.systemPrompts.openSections.list }">
        <button class="panel-section-head w-panel__section-head"
                @click="$store.systemPrompts.toggleSection('list')"
                :aria-expanded="$store.systemPrompts.openSections.list">
            <span class="caret w-panel__caret" aria-hidden="true">›</span>
            <span class="panel-section-name w-panel__section-title">Prompts</span>
            <span class="panel-section-count w-count"
                  x-text="$store.systemPrompts.items.length"></span>
        </button>
        <div class="panel-section-body w-panel__section-body" x-show="$store.systemPrompts.openSections.list"
             x-transition.opacity.duration.120ms>
            <template x-for="item in $store.systemPrompts.items" :key="item.name">
                <div class="feature-row prompt-file-row" role="button" tabindex="0"
                     :class="{ 'is-current': item.name === $store.systemPrompts.selected }"
                     :aria-current="item.name === $store.systemPrompts.selected ? 'true' : null"
                     @click="$store.systemPrompts.select(item.name)"
                     @keydown.enter.prevent="$store.systemPrompts.select(item.name)"
                     @keydown.space.prevent="$store.systemPrompts.select(item.name)"
                     :title="'source: ' + (item.source || '?')">
                    <span class="feature-name" x-text="item.name"></span>
                    <span class="tag w-chip" data-variant="meta" x-text="item.source"></span>
                    <span class="mono muted small" x-show="item.chars"
                          x-text="item.chars + ' chars'"></span>
                </div>
            </template>
        </div>
    </section>

    <!-- editor -->
    <section class="panel-section w-panel__section"
             x-show="$store.systemPrompts.selected"
             :class="{ open: $store.systemPrompts.openSections.editor }">
        <button class="panel-section-head w-panel__section-head"
                @click="$store.systemPrompts.toggleSection('editor')"
                :aria-expanded="$store.systemPrompts.openSections.editor">
            <span class="caret w-panel__caret" aria-hidden="true">›</span>
            <span class="panel-section-name w-panel__section-title">Editor</span>
            <span class="panel-section-count w-count"
                  x-text="$store.systemPrompts.sourceLabel()"></span>
        </button>
        <div class="panel-section-body w-panel__section-body" x-show="$store.systemPrompts.openSections.editor"
             x-transition.opacity.duration.120ms>

            <!-- metadata bar -->
            <div class="panel-meta" x-show="$store.systemPrompts.selected">
                <span class="tag w-chip" data-variant="meta" x-text="$store.systemPrompts.sourceLabel()"></span>
                <span x-show="$store.systemPrompts.version !== null"
                      x-text="'v' + $store.systemPrompts.version"></span>
                <span x-text="$store.systemPrompts.chars + ' chars'"></span>
                <span class="w-chip" data-tone="attention" x-show="$store.systemPrompts.dirty">
                    <span class="w-chip__glyph" aria-hidden="true">◆</span><span>Unsaved</span>
                </span>
            </div>

            <!-- validation warnings -->
            <div class="prompt-validation w-banner" data-tone="danger" role="alert"
                 x-show="$store.systemPrompts.hasValidationIssues()">
                <span class="w-banner__glyph" aria-hidden="true">✗</span>
                <div class="w-banner__msg">
                    <strong>Missing anchors</strong>
                    <template x-for="anchor in $store.systemPrompts.validation" :key="anchor">
                        <div class="prompt-validation-anchor mono" x-text="anchor"></div>
                    </template>
                </div>
            </div>

            <!-- textarea editor -->
            <textarea class="prompt-editor w-textarea" data-mono
                      aria-label="System prompt text"
                      x-model="$store.systemPrompts.text"
                      @input="$store.systemPrompts.markDirty()"
                      :disabled="$store.systemPrompts.loading"
                      placeholder="Prompt text will appear here…"></textarea>

            <!-- actions -->
            <div class="finding-actions">
                <button type="button" class="finding-action-btn approve w-btn" data-variant="primary" data-size="sm"
                        @click="$store.systemPrompts.save()"
                        :disabled="$store.systemPrompts.saving || !$store.systemPrompts.dirty"
                        :aria-busy="$store.systemPrompts.saving ? 'true' : null"
                        x-text="$store.systemPrompts.saving ? 'Saving…' : 'Save'"></button>
                <button type="button" class="finding-action-btn w-btn" data-variant="secondary" data-size="sm"
                        @click="$store.systemPrompts.reload()">Reload</button>
                <button type="button" class="finding-action-btn w-btn" data-variant="ghost" data-size="sm"
                        @click="$store.systemPrompts.init($store.systemPrompts.selected)"
                        title="Seed template file from hardcoded fallback">Init</button>
                <button type="button" class="finding-action-btn refute w-btn" data-variant="ghost" data-size="sm"
                        @click="$store.systemPrompts.reset()"
                        title="Delete file override, revert to hardcoded fallback">Reset</button>
            </div>

            <!-- error display -->
            <div class="history-error w-banner" data-tone="danger" role="alert" x-show="$store.systemPrompts.error">
                <span class="w-banner__glyph" aria-hidden="true">✗</span>
                <p class="err-text w-banner__msg" x-text="$store.systemPrompts.error"></p>
            </div>
        </div>
    </section>

    <!-- footnote -->
    <div class="panel-footnote"
         x-show="$store.systemPrompts.path"
         :title="'Override file: ' + $store.systemPrompts.path"
         x-text="'↳ ' + $store.systemPrompts.path"></div>

</aside>
