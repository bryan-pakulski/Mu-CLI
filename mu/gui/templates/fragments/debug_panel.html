<aside class="mode-panel"
       data-mode="debug"
       x-show="$store.mode.active === 'debug'"
       x-transition.opacity.duration.200ms>

    {% with shell_mode="debug" %}{% include "fragments/mode_shell.html" %}{% endwith %}

    <!-- empty state (Mu §4.6): what the mode is for and the first step -->
    <div class="panel-empty w-empty" data-size="sm" data-tone="attention"
         x-show="$store.debug.loaded && !$store.debug.state.case">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-bug"></use></svg></div>
        <h3 class="w-empty__title">Open a case</h3>
        <p class="w-empty__body">Describe the bug in chat. The agent opens a case, records a failing
        reproducer, and tracks hypotheses until a verified fix.</p>
    </div>

    <template x-if="$store.debug.state.case">
        <div class="mode-body" role="tabpanel">
            <ol class="w-stepper" aria-label="Case progress" data-compact>
                <template x-for="step in $store.debug.stepper()" :key="step.id">
                    <li class="w-stepper__step" :data-status="step.status"
                        :aria-current="step.status === 'active' || step.status === 'waiting' ? 'step' : null">
                        <span aria-hidden="true" x-text="step.glyph"></span>
                        <span x-text="step.label"></span>
                    </li>
                </template>
            </ol>

            <!-- Case -->
            <section class="w-group" x-show="$store.debug.tab === 'Case'">
                <dl class="w-facts">
                    <dt>Symptom</dt><dd x-text="$store.debug.state.case.symptom"></dd>
                    <dt>Reproducer</dt>
                    <dd><code class="mono" x-show="$store.debug.state.case.repro.command" x-text="$store.debug.state.case.repro.command"></code>
                        <span x-show="!$store.debug.state.case.repro.command">not recorded yet</span></dd>
                    <dt x-show="$store.debug.state.case.repro.expect">Fails with</dt>
                    <dd x-show="$store.debug.state.case.repro.expect" x-text="$store.debug.state.case.repro.expect"></dd>
                    <dt x-show="$store.debug.state.case.fix.summary">Fix</dt>
                    <dd x-show="$store.debug.state.case.fix.summary" x-text="$store.debug.state.case.fix.summary"></dd>
                    <dt x-show="$store.debug.state.case.root_cause">Root cause</dt>
                    <dd x-show="$store.debug.state.case.root_cause" x-text="($store.debug.state.case.root_cause || {}).cause"></dd>
                </dl>
                <h3 class="w-group__title" x-show="$store.debug.suspects().length">Suspects</h3>
                <ul class="w-rows">
                    <template x-for="s in $store.debug.suspects()" :key="s.path + ':' + s.line">
                        <li class="w-row">
                            <span class="w-sign" data-status="pending" aria-hidden="true">○</span>
                            <button type="button" class="w-row__main" @click="$store.debug.openFile(s)">
                                <span class="w-row__title mono" x-text="window.MuModeModels.debug.suspectLabel(s)"></span>
                                <span class="w-row__sub" x-text="s.reason"></span>
                            </button>
                        </li>
                    </template>
                </ul>
                <p class="w-group__empty" x-show="$store.debug.state.plan_mode">Plan mode is on — runs are unavailable; hypotheses and suspects still work.</p>
            </section>

            <!-- Hypotheses -->
            <section class="w-group" x-show="$store.debug.tab === 'Hypotheses'">
                <p class="w-group__empty" x-show="!$store.debug.hypotheses().length">No hypotheses yet.</p>
                <ul class="w-rows">
                    <template x-for="h in $store.debug.hypotheses()" :key="h.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="h.status" aria-hidden="true" x-text="h.glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.debug.openHypothesis(h.raw)">
                                <span class="w-row__title" x-text="h.title"></span>
                                <span class="w-row__sub" x-text="h.sub"></span>
                            </button>
                            <span class="w-row__when mono" x-text="h.id"></span>
                        </li>
                    </template>
                </ul>
            </section>

            <!-- Runs (shared CheckRun rows) -->
            <section class="w-group" x-show="$store.debug.tab === 'Runs'">
                <p class="w-group__empty" x-show="!$store.debug.runs().length">No runs yet.</p>
                <ul class="w-rows">
                    <template x-for="r in $store.debug.runs()" :key="r.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="r.status" aria-hidden="true" x-text="r.glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.debug.openRun(r.raw)">
                                <span class="w-row__title" x-text="r.title"></span>
                                <span class="w-row__sub mono" x-text="r.sub"></span>
                            </button>
                            <span class="w-row__when" x-text="r.when"></span>
                        </li>
                    </template>
                </ul>
            </section>

            <!-- Root causes from the Memory Ledger for the files involved -->
            <section class="w-group" x-show="$store.debug.tab === 'Root causes'">
                <p class="w-group__empty" x-show="!($store.debug.state.past_root_causes || []).length">No past root causes for these files.</p>
                <ul class="w-rows">
                    <template x-for="rc in ($store.debug.state.past_root_causes || [])" :key="rc.id">
                        <li class="w-row">
                            <span class="w-sign" data-status="done" aria-hidden="true">✓</span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="(rc.root_cause && rc.root_cause.cause) || rc.statement"></span>
                                <span class="w-row__sub" x-text="(rc.root_cause && rc.root_cause.signature) || ''"></span>
                            </div>
                        </li>
                    </template>
                </ul>
            </section>

            <details class="w-disclose" x-show="($store.debug.state.cases || []).length > 1">
                <summary>Other cases</summary>
                <ul class="w-rows">
                    <template x-for="c in ($store.debug.state.cases || [])" :key="c.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="window.MuModes.vstyle('debug_case', c.status).status" aria-hidden="true"
                                  x-text="window.MuModes.vstyle('debug_case', c.status).glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.debug.selectCase(c.id)">
                                <span class="w-row__title" x-text="c.title"></span>
                                <span class="w-row__sub" x-text="window.MuModes.vstyle('debug_case', c.status).label"></span>
                            </button>
                            <span class="w-row__when mono" x-text="c.id"></span>
                        </li>
                    </template>
                </ul>
            </details>
        </div>
    </template>
</aside>
