<aside class="mode-panel files-panel files-browser-panel"
       data-mode="files"
       x-data="filesBrowserPanel()"
       x-show="$store.mode.active === 'files'"
       x-transition.opacity.duration.200ms>

    <div class="panel-head files-browser-head">
        <div>
            <div class="panel-title">Files</div>
            <div class="panel-subtitle">Browse the attached workspace. Editing stays in your normal development environment.</div>
        </div>
        <button type="button" class="files-refresh w-btn" data-variant="icon" @click="$store.files.refreshTree()" title="Refresh workspace" aria-label="Refresh workspace"><svg class="w-icon" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-refresh-cw"></use></svg></button>
    </div>

    <template x-if="!$store.files.roots.length && !$store.files.loading && !$store.files.error">
        <div class="files-empty w-empty" data-size="sm" data-tone="accent">
            <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-folder-open"></use></svg></div>
            <h3 class="files-empty-title w-empty__title">No workspace attached</h3>
            <p class="w-empty__body">Attach a folder to browse its structure.</p>
            <div class="w-empty__actions">
                <button type="button" class="w-btn" data-variant="primary" @click="attachWorkspace()" title="Pick a workspace folder">Attach folder</button>
            </div>
        </div>
    </template>

    <div class="files-error w-banner" data-tone="danger" role="alert" x-show="$store.files.error">
        <span class="w-banner__glyph" aria-hidden="true">✗</span>
        <p class="w-banner__msg" x-text="$store.files.error"></p>
    </div>

    <div class="files-browser" x-show="$store.files.roots.length || $store.files.loading">
        <div class="files-loading muted ui-loading-region" role="status" x-show="$store.files.loading">Loading workspace…</div>
        <div class="files-tree" x-show="!$store.files.loading">
            <template x-for="root in $store.files.roots" :key="root.path">
                <section class="files-root">
                    <div class="files-root-label mono" x-text="root.path" :title="root.path"></div>
                    <template x-for="child in root.children" :key="child.path">
                        <div class="files-entry-wrap">
                            <template x-if="child.is_dir">
                                <button type="button" class="files-entry dir"
                                        :class="{ selected: $store.files.selectedPath === child.path }"
                                        :aria-current="$store.files.selectedPath === child.path ? 'true' : null"
                                        @click="$store.files.selectedPath = child.path; $store.files.expand(child.path)"
                                        :title="child.path">
                                    <span class="files-entry-chevron" aria-hidden="true" x-text="$store.files.expanded[child.path] ? '⌄' : '›'"></span>
                                    <svg class="files-entry-icon w-icon" data-size="sm" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-folder"></use></svg>
                                    <span class="name" x-text="child.name"></span>
                                </button>
                            </template>
                            <template x-if="!child.is_dir">
                                <button type="button" class="files-entry file"
                                        :class="{ selected: $store.files.selectedPath === child.path }"
                                        :aria-current="$store.files.selectedPath === child.path ? 'true' : null"
                                        @click="$store.files.selectedPath = child.path"
                                        :title="child.path">
                                    <span class="files-entry-chevron" aria-hidden="true"></span>
                                    <svg class="files-entry-icon w-icon" data-size="sm" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-file"></use></svg>
                                    <span class="name" x-text="child.name"></span>
                                </button>
                            </template>

                            <template x-if="child.is_dir && $store.files.expanded[child.path]">
                                <div class="files-subtree">
                                    <template x-for="sub in (child.children || [])" :key="sub.path">
                                        <div class="files-entry-wrap">
                                            <template x-if="sub.is_dir">
                                                <button type="button" class="files-entry dir indent"
                                                        :class="{ selected: $store.files.selectedPath === sub.path }"
                                                        @click="$store.files.selectedPath = sub.path; $store.files.expand(sub.path)"
                                                        :title="sub.path">
                                                    <span class="files-entry-chevron" aria-hidden="true" x-text="$store.files.expanded[sub.path] ? '⌄' : '›'"></span>
                                                    <svg class="files-entry-icon w-icon" data-size="sm" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-folder"></use></svg>
                                                    <span class="name" x-text="sub.name"></span>
                                                </button>
                                            </template>
                                            <template x-if="!sub.is_dir">
                                                <button type="button" class="files-entry file indent"
                                                        :class="{ selected: $store.files.selectedPath === sub.path }"
                                                        @click="$store.files.selectedPath = sub.path"
                                                        :title="sub.path">
                                                    <span class="files-entry-chevron" aria-hidden="true"></span>
                                                    <svg class="files-entry-icon w-icon" data-size="sm" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-file"></use></svg>
                                                    <span class="name" x-text="sub.name"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="files-entry files-empty-directory muted indent" x-show="(child.children || []).length === 0">Empty folder</div>
                                </div>
                            </template>
                        </div>
                    </template>
                </section>
            </template>
        </div>
    </div>
</aside>

<script>
function filesBrowserPanel() {
    return {
        async attachWorkspace() {
            Alpine.store("fileBrowser").show("folder", async (path) => {
                const response = await fetch("/api/workspace", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path }),
                });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    Alpine.store("toast").show(data.detail || "Could not attach workspace", "error");
                    return;
                }
                await Alpine.store("files").load();
                await Alpine.store("inspector").loadWorkspace();
            });
        },
    };
}
</script>
