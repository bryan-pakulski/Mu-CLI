<aside class="mode-panel memory-panel"
       data-mode="memory"
       x-show="$store.mode.active === 'memory'"
       x-transition.opacity.duration.200ms
       x-data="{}">

    <!-- empty state -->
    <div class="panel-empty" x-show="!$store.memory.active">
        <h3>no context yet</h3>
        <p class="muted">Send a prompt in chat. The map fills with one
        color-banded row per context layer (system, workspace, skills,
        summary, goal, history) and updates live as the model runs.</p>
    </div>

    <div x-show="$store.memory.active" class="memory-body">
        <!-- Header: this is capacity, not merely a share of used layers. -->
        <div class="panel-head">
            <div class="panel-subject">context window</div>
            <div class="panel-meta mono muted">
                <span x-text="$store.memory.totalTokens + ' / ' + ($store.memory.contextLimit || 0) + ' tok'"></span>
                <span x-text="' · ' + $store.memory.fillPct + '%'"></span>
            </div>
        </div>

        <div class="memory-capacity" aria-label="Context capacity">
            <div class="memory-capacity-used" :style="'width:' + Math.min(100, $store.memory.fillPct) + '%'"></div>
        </div>
        <div class="memory-capacity-label mono muted">
            <span x-text="$store.memory.totalTokens + ' used' "></span>
            <span x-text="$store.memory.freeTokens + ' free' "></span>
        </div>

        <!-- controls: view mode + resolution -->
        <div class="memory-controls">
            <div class="memory-view-toggle" role="group" aria-label="render view">
                <button type="button"
                        :class="{ active: $store.memory.view === 'heat' }"
                        @click="$store.memory.setView('heat')"
                        title="Brightness = how often each slice changed">heat</button>
                <button type="button"
                        :class="{ active: $store.memory.view === 'layer' }"
                        @click="$store.memory.setView('layer')"
                        title="Solid color per layer">layer</button>
            </div>
            <label class="mono muted" for="mem-res">res</label>
            <select id="mem-res"
                    x-model.number="$store.memory.resolution"
                    @change="$store.memory.load()">
                <option :value="64">64</option>
                <option :value="128">128</option>
                <option :value="256">256</option>
            </select>
            <button class="memory-refresh"
                    @click="$store.memory.load()"
                    title="Refresh snapshot">↻</button>
        </div>

        <!-- the fingerprint grid -->
        <div class="memory-canvas-wrap">
            <canvas x-ref="grid"
                    class="memory-canvas"
                    x-init="$store.memory.bindCanvas($refs.grid)"></canvas>
            <!-- layer band dividers, positioned by row share -->
            <div class="memory-dividers">
                <template x-for="l in $store.memory.regions" :key="l.id">
                    <div class="memory-divider"
                         x-show="l.row_start > 0"
                         :style="'top:' + (l.row_start / $store.memory.rows * 100) + '%'"></div>
                </template>
            </div>
        </div>

        <!-- Per-layer legend — click a layer to open its actual
             content in a modal (what the model sees at that layer). -->
        <div class="memory-legend">
            <template x-for="l in $store.memory.layers" :key="l.id">
                <div class="memory-legend-row"
                     :class="{ empty: !l.tokens }"
                     role="button"
                     tabindex="0"
                     :title="'View ' + l.id + ' layer contents'"
                     @click="$store.memory.openLayer(l)"
                     @keydown.enter.prevent="$store.memory.openLayer(l)"
                     @keydown.space.prevent="$store.memory.openLayer(l)">
                    <span class="memory-legend-swatch"
                          :style="'background:hsl(' + (l.hue || 0) + ',68%,42%)'"></span>
                    <span class="memory-legend-id mono" x-text="l.id"></span>
                    <span class="memory-legend-name" x-text="l.name"></span>
                    <span class="memory-legend-tok mono muted"
                          :style="'color:' + (l.fill_pct > 90 ? 'var(--err)' : '')"
                          x-text="l.tokens + '  ·  ' + l.fill_pct + '%'"></span>
                    <span class="memory-legend-delta mono"
                          :class="{ hot: l.change_count > 0 }"
                          x-text="'Δ' + (l.change_count || 0)"
                          title="chunks changed since first seen"></span>
                </div>
            </template>
            <div class="memory-legend-row memory-free-row">
                <span class="memory-legend-swatch memory-free-swatch"></span>
                <span class="memory-legend-id mono">free</span>
                <span class="memory-legend-name">Available space</span>
                <span class="memory-legend-tok mono muted"
                      x-text="$store.memory.freeTokens + '  ·  ' + (100 - Math.min(100, $store.memory.fillPct)).toFixed(1) + '%'"></span>
                <span class="memory-legend-delta mono">static</span>
            </div>
        </div>

        <div class="panel-footnote muted mono" x-show="$store.memory.loaded">
            <span x-text="'height = total context capacity · grey = free · hue = layer · brightness = change frequency · live per iteration'"></span>
        </div>
    </div>

</aside>
