<!-- Shared Mode OS chrome (Mu). Domain content stays in the surrounding mode
     fragment. Quiet type, space and hairlines — no nested surfaces — so the
     stage panel remains the single plane: a title-3 heading with the status
     as a sign + word (provenance on hover), the objective only while the
     workspace is empty, the metrics that aren't zero, lenses as tabs (no zero
     counts) and a search field. Mode-OS tones (active/good/warn/risk) map onto
     Wash semantics (running/ok/caution/danger). -->
<header class="mode-os" x-show="$store.modeWorkspace.current()"
        x-data="{
            washTone(t) { return ({ active: 'running', good: 'ok', warn: 'caution', risk: 'danger' })[t] || 'neutral'; },
            signOf(t) { return ({ active: 'active', risk: 'failed', warn: 'unverified', good: 'done' })[t] || 'pending'; },
            zero(v) { return /^\s*(0+(\.0+)?%?|0\/0|—|-|)\s*$/.test(String(v == null ? '' : v)); },
            fresh() { const ws = $store.modeWorkspace.current(); return !ws || (ws.metrics || []).every(m => this.zero(m.value)); }
        }">
    <div class="mode-os-heading">
        <h2 x-text="$store.modeWorkspace.current() && $store.modeWorkspace.current().title"></h2>
        <span class="mode-os-status w-signword"
              :data-status="signOf(($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) || 'neutral')"
              :data-tone="washTone(($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) || 'neutral')"
              :data-mode-tone="($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) || 'neutral'"
              :title="$store.modeWorkspace.current() && $store.modeWorkspace.current().provenance">
            <span class="w-sign" aria-hidden="true"
                  :data-status="signOf(($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) || 'neutral')"
                  x-text="(($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) || 'neutral') === 'active' ? '●' : ((($store.modeWorkspace.current() && $store.modeWorkspace.current().status.tone) === 'risk') ? '✗' : '○')"></span>
            <span x-text="$store.modeWorkspace.current() && $store.modeWorkspace.current().status.label"></span>
        </span>
    </div>
    <!-- The objective explains the mode only while it holds nothing yet (Mu §4.6). -->
    <p class="mode-os-objective" x-show="fresh()" x-text="$store.modeWorkspace.current() && $store.modeWorkspace.current().objective"></p>

    <!-- Metrics: only the ones that say something; zeros are left out (Mu §5.5). -->
    <dl class="mode-os-metrics">
        <template x-for="metric in (($store.modeWorkspace.current() && $store.modeWorkspace.current().metrics) || [])"
                  :key="metric.id">
            <div class="mode-os-metric" :data-tone="metric.tone" :title="metric.detail" x-show="!zero(metric.value)">
                <dd x-text="metric.value"></dd>
                <dt x-text="metric.label"></dt>
            </div>
        </template>
    </dl>

    <div class="mode-os-commandbar">
        <nav class="mode-os-lenses w-tabs" aria-label="Workspace views">
            <template x-for="view in (($store.modeWorkspace.current() && $store.modeWorkspace.current().views) || [])"
                      :key="view.id">
                <button type="button" class="w-tabs__tab"
                        :class="{ active: $store.modeWorkspace.selectedView() === view.id }"
                        :aria-current="$store.modeWorkspace.selectedView() === view.id ? 'page' : null"
                        @click="$store.modeWorkspace.select(view.id)">
                    <span x-text="view.label"></span>
                    <span class="count w-count" x-show="view.count !== undefined && !zero(view.count)" x-text="view.count"></span>
                </button>
            </template>
        </nav>
        <label class="mode-os-search">
            <svg class="w-icon" data-size="sm" aria-hidden="true" focusable="false"><use href="/static/icons/wash.svg#i-search"></use></svg>
            <input type="search" class="w-input"
                   aria-label="Search this workspace"
                   :placeholder="$store.modeWorkspace.current() && $store.modeWorkspace.current().search_placeholder"
                   :value="$store.modeWorkspace.query()"
                   @input="$store.modeWorkspace.setQuery($event.target.value)" />
        </label>
    </div>

    <section class="mode-os-quality" :class="{ open: $store.modeWorkspace.isQualityOpen() }">
        <button type="button" class="mode-os-quality-toggle w-panel__section-head"
                @click="$store.modeWorkspace.toggleQuality()"
                :aria-expanded="$store.modeWorkspace.isQualityOpen()">
            <span class="caret w-panel__caret" aria-hidden="true">›</span>
            <span class="w-panel__section-title">How to read confidence, accuracy, and relevance</span>
        </button>
        <div class="mode-os-quality-grid" x-show="$store.modeWorkspace.isQualityOpen()"
             x-transition.opacity.duration.120ms>
            <template x-for="item in (($store.modeWorkspace.current() && $store.modeWorkspace.current().quality) || [])"
                      :key="item.id">
                <div class="mode-os-quality-item" :data-state="item.state">
                    <div>
                        <strong x-text="item.label"></strong>
                        <span class="mode-os-quality-state" x-text="item.state.replace(/-/g, ' ')"></span>
                    </div>
                    <p x-text="item.detail"></p>
                </div>
            </template>
        </div>
    </section>
</header>
