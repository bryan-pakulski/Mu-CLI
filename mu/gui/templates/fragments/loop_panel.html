<aside class="mode-panel"
       data-mode="loop"
       x-show="$store.mode.active === 'loop'"
       x-transition.opacity.duration.200ms>

    {% with shell_mode="loop" %}{% include "fragments/mode_shell.html" %}{% endwith %}

    <div class="panel-empty w-empty" data-size="sm" data-tone="running"
         x-show="$store.loop.loaded && !$store.loop.mission()">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-repeat"></use></svg></div>
        <h3 class="w-empty__title">Start a mission</h3>
        <p class="w-empty__body">Give the loop a goal, when it is done, and a budget. It works in
        increments with evidence until then — you can pause or stop it any time.</p>
        <div class="w-empty__actions">
            <button type="button" class="w-btn" data-variant="secondary" data-size="sm" @click="$store.loop.handle('start')">Start a mission</button>
        </div>
    </div>

    <template x-if="$store.loop.mission()">
        <div class="mode-body" role="tabpanel">
            <!-- the tightest budget, as one meter -->
            <div class="mode-meter" x-show="$store.loop.meter()">
                <span class="w-bar" role="img"
                      :aria-label="'Budget used: ' + ($store.loop.meter() || {}).label"
                      :style="'--v:' + Math.round((($store.loop.meter() || {}).ratio || 0) * 100) + '%'"
                      :data-tone="(($store.loop.meter() || {}).ratio || 0) >= 0.9 ? 'attention' : null"></span>
                <span class="w-row__sub" x-text="($store.loop.meter() || {}).label"></span>
            </div>

            <section class="w-group" x-show="$store.loop.tab === 'Mission'">
                <p class="mode-goal" x-text="$store.loop.mission().goal"></p>
                <h3 class="w-group__title" x-show="$store.loop.criteria().length">Done when</h3>
                <ul class="w-rows">
                    <template x-for="c in $store.loop.criteria()" :key="c.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="c.status" aria-hidden="true" x-text="c.glyph"></span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="c.title"></span>
                                <span class="w-row__sub" x-text="c.sub"></span>
                            </div>
                        </li>
                    </template>
                </ul>
                <div class="w-btn-row">
                    <button type="button" class="w-textbtn" data-tone="danger"
                            x-show="['running', 'paused', 'blocked'].includes($store.loop.mission().status)"
                            @click="$store.loop.handle('stop')">Stop mission…</button>
                </div>
            </section>

            <section class="w-group" x-show="$store.loop.tab === 'Timeline'">
                <p class="w-group__empty" x-show="!$store.loop.timeline().length">No increments yet.</p>
                <ul class="w-rows">
                    <template x-for="inc in $store.loop.timeline()" :key="inc.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="inc.status" aria-hidden="true" x-text="inc.glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.loop.openIncrement(inc.raw)">
                                <span class="w-row__title" x-text="inc.title"></span>
                                <span class="w-row__sub" x-text="inc.sub"></span>
                            </button>
                            <span class="w-row__when" x-text="inc.when"></span>
                        </li>
                    </template>
                </ul>
            </section>

            <section class="w-group" x-show="$store.loop.tab === 'Backlog'">
                <p class="w-group__empty" x-show="!$store.loop.backlog().length">The backlog is empty.</p>
                <button type="button" class="w-textbtn" @click="$store.loop.handle('add-item')">Add item</button>
                <ul class="w-rows">
                    <template x-for="item in $store.loop.backlog()" :key="item.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="item.status" aria-hidden="true" x-text="item.glyph"></span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="item.title"></span>
                                <span class="w-row__sub" x-text="item.note ? item.sub + ' · ' + item.note : item.sub"></span>
                            </div>
                            <span class="w-row__actions">
                                <template x-for="action in (item.actions || [])" :key="action.id">
                                    <button type="button" class="w-textbtn" :data-tone="action.primary ? null : 'quiet'"
                                            @click.stop="$store.loop.workAct(item, action)" x-text="action.label"></button>
                                </template>
                            </span>
                            <span class="w-row__when mono" x-text="item.id"></span>
                        </li>
                    </template>
                </ul>
            </section>
        </div>
    </template>
</aside>
