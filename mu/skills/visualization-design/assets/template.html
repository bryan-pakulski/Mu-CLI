<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MuCLI visualization</title>
  <style>
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --mu-canvas:#0d1219; --mu-glass:rgba(18,24,32,.90);
      --mu-text:#eef2f6; --mu-soft:#bbc4cd; --mu-dim:#85909c;
      --mu-accent:#8ba9c6; --mu-border:rgba(222,231,240,.085);
      --mu-grid:rgba(222,231,240,.09);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --mu-canvas:#edf3f8; --mu-glass:rgba(252,254,255,.91);
      --mu-text:#1c2732; --mu-soft:#53616e; --mu-dim:#5f6e7b;
      --mu-accent:#6286a8; --mu-border:rgba(39,59,77,.10);
      --mu-grid:rgba(39,59,77,.10);
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      padding:16px;
      background:var(--mu-canvas);
      color:var(--mu-text);
      font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .frame {
      max-width:1080px; margin:0 auto; padding:24px;
      border:1px solid var(--mu-border); border-radius:16px;
      background:var(--mu-glass); backdrop-filter:blur(18px);
      box-shadow:0 18px 48px rgba(8,15,22,.12);
    }
    h1 { margin:0; font-size:20px; line-height:1.25; font-weight:650; }
    .subtitle { margin:6px 0 20px; color:var(--mu-dim); }
    .visual {
      min-height:260px; border-block:1px solid var(--mu-border);
      display:grid; place-items:center; color:var(--mu-soft);
    }
    .note { margin:12px 0 0; color:var(--mu-dim); font-size:12px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-variant-numeric:tabular-nums; }
    :focus-visible { outline:2px solid var(--mu-accent); outline-offset:3px; }
    @media (max-width:480px) {
      body { padding:8px; }
      .frame { padding:16px; border-radius:12px; }
      h1 { font-size:18px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Question-led title</h1>
    <p class="subtitle">Measure · population · time range · unit</p>
    <section class="visual" role="img" aria-label="Describe the visual and its main conclusion">
      Replace with an accessible SVG, canvas, table, or interactive view.
    </section>
    <p class="note">Source · freshness · aggregation or uncertainty note</p>
  </main>
  <script>
    function redrawForTheme(theme) {
      // Canvas/WebGL only: resolve --mu-* tokens and redraw while preserving state.
      void theme;
    }
    addEventListener('mucli-theme-change', event => redrawForTheme(event.detail.theme));
  </script>
</body>
</html>
