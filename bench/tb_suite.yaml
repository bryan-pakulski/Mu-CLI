# MuCLI harness benchmark — curated Terminal-Bench Core task selection.
# Run: ./benchmark.sh [--smoke]
# Time gates come from each task's max_agent_timeout_sec (TB enforces natively).
# Keep this at 50 unique task IDs. The labels are coverage strata; each task's
# task.yaml remains authoritative for its category, difficulty, and time gate.

name: terminal-bench-core
version: 0.1.1
sources:
  - id: terminal-bench
    url: https://github.com/laude-institute/terminal-bench
    role: isolated environments, oracle solutions, and task verifiers
  - id: swe-bench
    url: https://www.swebench.com/
    task_ids:
      - swe-bench-astropy-1
      - swe-bench-astropy-2
      - swe-bench-fsspec
      - swe-bench-langcodes
  - id: mteb
    url: https://github.com/embeddings-benchmark/mteb
    task_ids: [eval-mteb]
  - id: gymnasium
    url: https://gymnasium.farama.org/environments/classic_control/cart_pole/
    task_ids: [cartpole-rl-training]
task_ids:
  # File operations and data transformation
  - hello-world
  - heterogeneous-dates
  - organization-json-generator
  - decommissioning-service-with-sensitive-data
  - csv-to-parquet
  - reshard-c4-data
  - simple-web-scraper
  - hf-model-inference
  - eval-mteb

  # Debugging and real-repository repair
  - processing-pipeline
  - fix-pandas-version
  - incompatible-python-fasttext
  - sqlite-db-truncate
  - swe-bench-astropy-1
  - swe-bench-astropy-2
  - swe-bench-fsspec
  - swe-bench-langcodes
  - tmux-advanced-workflow

  # Version control, services, and system administration
  - fix-git
  - git-multibranch
  - configure-git-webserver
  - nginx-request-logging
  - cron-broken-network
  - fix-permissions
  - build-tcc-qemu
  - build-initramfs-qemu
  - build-linux-kernel-qemu
  - qemu-alpine-ssh
  - qemu-startup
  - sqlite-with-gcov

  # Software engineering and programming languages
  - fibonacci-server
  - grid-pattern-transform
  - modernize-fortran-build
  - path-tracing
  - polyglot-c-py
  - prove-plus-comm
