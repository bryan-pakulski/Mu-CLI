<aside class="mode-panel"
       data-mode="teacher"
       x-show="$store.mode.active === 'teacher'"
       x-transition.opacity.duration.200ms>

    {% with shell_mode="teacher" %}{% include "fragments/mode_shell.html" %}{% endwith %}

    <div class="panel-empty w-empty" data-size="sm" data-tone="plan"
         x-show="$store.teacher.loaded && !$store.teacher.course()">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-graduation-cap"></use></svg></div>
        <h3 class="w-empty__title">Learn something</h3>
        <p class="w-empty__body">Tell the tutor what you want to learn. It starts with a short
        conversation about you, proposes a curriculum for your approval, and teaches lesson by lesson.</p>
    </div>

    <template x-if="$store.teacher.course()">
        <div class="mode-body" role="tabpanel">
            <!-- Path: modules → lessons with their gate state in line 2 -->
            <section class="w-group" x-show="$store.teacher.tab === 'Path'">
                <template x-for="m in $store.teacher.path()" :key="m.module_id">
                    <div class="w-group">
                        <h3 class="w-group__title" x-text="m.title + (m.mastery_pct != null ? ' · ' + m.mastery_pct + '%' : '')"></h3>
                        <ul class="w-rows">
                            <template x-for="l in m.lessons" :key="l.lesson_id">
                                <li class="w-row" x-data="{ r: $store.teacher.lessonRow(l) }">
                                    <span class="w-sign" :data-status="r.status" aria-hidden="true" x-text="r.glyph"></span>
                                    <button type="button" class="w-row__main" @click="$store.teacher.openLesson(l)">
                                        <span class="w-row__title" x-text="r.title"></span>
                                        <span class="w-row__sub" x-text="r.sub"></span>
                                    </button>
                                    <span class="w-row__actions">
                                        <button type="button" class="w-textbtn" x-show="l.lecture_transcript_path" @click.stop="$store.teacher.openTranscript(l)">Read</button>
                                        <button type="button" class="w-textbtn" data-tone="quiet"
                                                x-show="l.status === 'pending' && (l.order_blockers || []).length && $store.teacher.course().status === 'in_progress'"
                                                @click.stop="$store.teacher.startOutOfOrder(l)">Start anyway…</button>
                                    </span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <div class="w-btn-row" x-show="$store.teacher.course().status === 'in_progress'">
                    <button type="button" class="w-textbtn" data-tone="quiet" @click="$store.teacher.finishEarly()">Finish early…</button>
                </div>
            </section>

            <!-- Lesson: the current lesson's checks and exercises -->
            <section class="w-group" x-show="$store.teacher.tab === 'Lesson'">
                <template x-if="$store.teacher.currentLesson()">
                    <div>
                        <h3 class="w-group__title" x-text="$store.teacher.currentLesson().title"></h3>
                        <p class="w-row__sub" x-text="window.MuModeModels.teacher.lessonGateLine($store.teacher.currentLesson())"></p>
                        <ul class="w-rows">
                            <template x-for="k in $store.teacher.lessonChecks()" :key="k.id">
                                <li class="w-row">
                                    <span class="w-sign" :data-status="k.status" aria-hidden="true" x-text="k.glyph"></span>
                                    <div class="w-row__main">
                                        <span class="w-row__title" x-text="k.title"></span>
                                        <span class="w-row__sub" x-text="k.sub"></span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <template x-for="a in $store.teacher.lessonAssignments()" :key="a.assignment_id">
                            <div class="w-group">
                                <h3 class="w-group__title" x-text="a.assignment_id + ' · ' + a.kind"></h3>
                                <div x-html="window.MuModeModels.teacher.gradeSheet(a)"></div>
                            </div>
                        </template>
                        <button type="button" class="w-textbtn" x-show="$store.teacher.currentLesson().lecture_transcript_path"
                                @click="$store.teacher.openTranscript($store.teacher.currentLesson())">Read the lesson</button>
                    </div>
                </template>
                <p class="w-group__empty" x-show="!$store.teacher.currentLesson()">No lesson in progress.</p>
            </section>

            <!-- Mastery per learning objective -->
            <section class="w-group" x-show="$store.teacher.tab === 'Mastery'">
                <p class="mode-goal" x-show="$store.teacher.course().course_mastery != null"
                   x-text="'Course mastery ' + $store.teacher.course().course_mastery + '%'"></p>
                <ul class="w-rows">
                    <template x-for="row in $store.teacher.mastery()" :key="row.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="row.status" aria-hidden="true" x-text="row.glyph"></span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="row.title"></span>
                                <span class="w-row__sub" x-text="row.sub"></span>
                            </div>
                        </li>
                    </template>
                </ul>
            </section>

            <!-- Spaced reviews by date -->
            <section class="w-group" x-show="$store.teacher.tab === 'Reviews'">
                <p class="w-group__empty" x-show="!$store.teacher.reviews().length">No reviews scheduled yet.</p>
                <ul class="w-rows">
                    <template x-for="r in $store.teacher.reviews()" :key="r.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="r.status" aria-hidden="true" x-text="r.glyph"></span>
                            <div class="w-row__main">
                                <span class="w-row__title" x-text="r.title"></span>
                                <span class="w-row__sub" x-text="r.sub"></span>
                            </div>
                        </li>
                    </template>
                </ul>
            </section>
        </div>
    </template>
</aside>
