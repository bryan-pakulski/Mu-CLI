name: Durable engineering jobs

on:
  push:
    branches:
      - feature/durable-engineering-jobs
  pull_request:
    paths:
      - 'config/model_pricing.json'
      - 'mu/jobs/**'
      - 'mu/ui/exceptions.py'
      - 'mu/commands/job.py'
      - 'mu/commands/job_diagnostics.py'
      - 'mu/commands/job_analysis.py'
      - 'mu/commands/costs.py'
      - 'mu/commands/__init__.py'
      - 'mu/gui/routers/jobs.py'
      - 'mu/gui/routers/job_analysis.py'
      - 'mu/gui/routers/providers.py'
      - 'mu/gui/routers/__init__.py'
      - 'mu/gui/app.py'
      - 'mu/gui/templates/index.html'
      - 'mu/gui/templates/work.html'
      - 'mu/gui/static/job_trace.html'
      - 'mu/gui/static/model_costs.html'
      - 'mu/gui/static/css/work.css'
      - 'mu/gui/static/css/work_polish.css'
      - 'mu/gui/static/css/job_trace.css'
      - 'mu/gui/static/css/model_costs.css'
      - 'mu/gui/static/js/work.js'
      - 'mu/gui/static/js/work_analysis_link.js'
      - 'mu/gui/static/js/work_diagnostics.js'
      - 'mu/gui/static/js/job_trace.js'
      - 'mu/gui/static/js/job_trace_signed_delta.js'
      - 'mu/gui/static/js/model_costs.js'
      - 'utils/model_pricing.py'
      - 'mobile/android/src/api/jobs.ts'
      - 'mobile/android/src/api/providers.ts'
      - 'mobile/android/src/navigation/AppNavigator.tsx'
      - 'mobile/android/src/components/ModernHeader.tsx'
      - 'mobile/android/src/screens/WorkScreen.tsx'
      - 'mobile/android/src/screens/JobDetailScreen.tsx'
      - 'mobile/android/src/screens/JobAnalysisScreen.tsx'
      - 'tests/test_job*.py'
      - 'tests/test_model_pricing.py'
      - '.github/workflows/durable-jobs.yml'

jobs:
  durable-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run durable jobs tests
        env:
          MUCLI_HOME: ${{ runner.temp }}/mucli-test
          PYTHONPATH: .
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            tests/test_jobs_core.py \
            tests/test_job_controller.py \
            tests/test_job_controller_verification.py \
            tests/test_job_runner.py \
            tests/test_job_repository.py \
            tests/test_job_worktree.py \
            tests/test_job_worker.py \
            tests/test_job_verification.py \
            tests/test_job_receipt.py \
            tests/test_job_review.py \
            tests/test_job_review_surfaces.py \
            tests/test_job_diagnostics.py \
            tests/test_job_diagnostics_surfaces.py \
            tests/test_job_performance.py \
            tests/test_model_pricing.py \
            2>&1 | tee "${RUNNER_TEMP}/durable-jobs-pytest.log"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-jobs-pytest
          path: ${{ runner.temp }}/durable-jobs-pytest.log
          if-no-files-found: ignore

  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/android/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile durable-work surfaces
        run: npm run typecheck
