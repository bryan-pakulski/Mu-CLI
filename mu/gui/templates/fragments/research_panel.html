<aside class="mode-panel"
       data-mode="research"
       x-show="$store.mode.active === 'research'"
       x-transition.opacity.duration.200ms>

    {% with shell_mode="research" %}{% include "fragments/mode_shell.html" %}{% endwith %}

    <!-- empty state -->
    <div class="panel-empty w-empty" data-size="sm" data-tone="plan" x-show="$store.research.loaded && $store.research.isEmpty()">
        <div class="w-empty__art" aria-hidden="true"><svg class="w-icon" focusable="false"><use href="/static/icons/wash.svg#i-book-open"></use></svg></div>
        <h3 class="w-empty__title">Ask a research question</h3>
        <p class="w-empty__body">Questions, sources and claims appear here as the agent researches.
        Every claim quotes a source it has read.</p>
    </div>

    <div class="mode-body" role="tabpanel" x-show="!$store.research.isEmpty()">
        <!-- Questions: the tree, with status and claim counts; picking one shows its claims -->
        <section class="w-group" x-show="$store.research.tab === 'Questions'">
            <ul class="w-rows rs-questions" role="listbox" aria-label="Research questions">
                <template x-for="q in $store.research.questionRows()" :key="q.id">
                    <li class="w-row rs-question" role="option"
                        :style="'--rs-depth:' + q.depth"
                        :aria-selected="$store.research.focusQuestion() === q.id ? 'true' : 'false'">
                        <span class="w-sign" aria-hidden="true"
                              :data-status="$store.research.vstyle('research_question', q.status).status"
                              x-text="$store.research.vstyle('research_question', q.status).glyph"></span>
                        <button type="button" class="w-row__main" @click="$store.research.selectQuestion(q.id); $store.research.setTab('Claims')">
                            <span class="w-row__title" x-text="q.text"></span>
                            <span class="w-row__sub">
                                <span x-text="$store.research.vstyle('research_question', q.status).label"></span>
                                <span x-show="q.claims" x-text="' · ' + q.claims + (q.claims === 1 ? ' claim' : ' claims')"></span>
                                <span x-show="q.origins" x-text="' · ' + q.origins + (q.origins === 1 ? ' origin' : ' origins')"></span>
                                <span x-show="q.id === $store.research.currentQuestion"> · current</span>
                            </span>
                        </button>
                        <span class="w-row__when mono" x-text="q.id"></span>
                    </li>
                </template>
            </ul>
        </section>

        <!-- Claims of the selected (or current) question -->
        <section class="w-group" x-show="$store.research.tab === 'Claims'">
            <p class="mode-goal" x-text="$store.research.claimsHeading()"></p>
            <p class="w-group__empty" x-show="!$store.research.visibleClaims().length">No claims recorded for this question yet.</p>
            <ul class="w-rows rs-claims">
                <template x-for="c in $store.research.visibleClaims()" :key="c.id">
                    <li class="w-row rs-claim">
                        <span class="w-sign" aria-hidden="true"
                              :data-status="$store.research.vstyle('research_confidence', c.confidence).status"
                              x-text="$store.research.vstyle('research_confidence', c.confidence).glyph"></span>
                        <button type="button" class="w-row__main" @click="$store.research.openClaim(c, $event)">
                            <span class="w-row__title rs-claim__text" x-text="c.text"></span>
                            <span class="w-row__sub">
                                <span x-text="$store.research.vstyle('research_confidence', c.confidence).label"></span>
                                <span x-show="c.kind !== 'observed'" x-text="' · ' + c.kind"></span>
                                <span x-show="c.contested" data-tone="attention"> · contested</span>
                                <span class="mono" x-text="' · ' + $store.research.claimSources(c)"></span>
                            </span>
                        </button>
                        <span class="w-row__when mono" x-text="c.id"></span>
                    </li>
                </template>
            </ul>
            <button type="button" class="w-textbtn" x-show="$store.research.matrix().origins.length"
                    @click="$store.modeExpand.open('research', 'matrix')">Expand matrix</button>
        </section>

        <!-- Sources: state as text tabs, type in a quiet Show menu; a row opens the source sheet -->
        <section class="w-group" x-show="$store.research.tab === 'Sources'">
            <nav class="w-tabs rs-source-states" role="tablist" aria-label="Source state">
                <template x-for="st in ['', 'cited', 'read', 'candidate']" :key="st || 'all'">
                    <button type="button" class="w-tabs__tab" role="tab"
                            x-show="!st || $store.research.stateCount(st)"
                            :class="{ active: $store.research.sourceState === st }"
                            :aria-selected="$store.research.sourceState === st ? 'true' : 'false'"
                            @click="$store.research.sourceState = st"
                            x-text="st ? $store.research.vstyle('research_source_state', st).label : 'read'"></button>
                </template>
            </nav>
            <label class="rs-show" x-show="$store.research.sourceTypes().length > 1">
                <span>Show</span>
                <select class="w-input" @change="$store.research.typeFilter = $event.target.value ? [$event.target.value] : []">
                    <option value="">every type</option>
                    <template x-for="type in $store.research.sourceTypes()" :key="type">
                        <option :value="type" x-text="type"></option>
                    </template>
                </select>
            </label>
            <template x-for="group in $store.research.groupedSources()" :key="group.topic">
                <div class="w-group">
                    <h3 class="w-group__title" x-text="group.topic"></h3>
                    <ul class="w-rows">
                        <template x-for="s in group.sources" :key="s.source_id">
                            <li class="w-row">
                                <span class="w-sign" aria-hidden="true"
                                      :data-status="$store.research.vstyle('research_source_state', s.state).status"
                                      x-text="$store.research.vstyle('research_source_state', s.state).glyph"></span>
                                <button type="button" class="w-row__main" @click="$store.research.openSource(s, $event)">
                                    <span class="w-row__title" x-text="s.title"></span>
                                    <span class="w-row__sub"
                                          x-text="$store.research.vstyle('research_source_state', s.state).label + ' · ' + s.origin + (s.state !== 'candidate' ? ' · ' + $store.research.credibilityPct(s.credibility_score) + '% credible' : '')"></span>
                                </button>
                                <span class="w-row__when mono" x-text="$store.research.sourceKey(s)"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </section>

        <!-- Citations: the bibliography; the report skeleton reads in the expanded view -->
        <section class="w-group" x-show="$store.research.tab === 'Citations'">
            <p class="w-group__empty" x-show="!$store.research.bibliography">Nothing read yet.</p>
            <pre class="bibliography-block" x-show="$store.research.bibliography"><code x-text="$store.research.bibliography"></code></pre>
            <div class="w-btn-row">
                <button type="button" class="w-textbtn" x-show="$store.research.bibliography" @click="$store.research.copyBibliography()">Copy bibliography</button>
                <button type="button" class="w-textbtn" x-show="$store.research.claims.length" @click="$store.research.openReport()">Read the report</button>
            </div>
        </section>
    </div>
</aside>
