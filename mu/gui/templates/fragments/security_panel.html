<aside class="mode-panel" data-mode="security" x-show="$store.mode.active === 'security'" x-transition.opacity.duration.200ms>
    {% with shell_mode="security" %}{% include "fragments/mode_shell.html" %}{% endwith %}
    <div class="panel-empty w-empty" data-size="sm" x-show="$store.security.loaded && !$store.security.state.report">
        <h3 class="w-empty__title">Start an audit</h3>
        <p class="w-empty__body">Describe the authorised scope in chat, or use <code>/security scan &lt;title&gt;</code>.</p>
    </div>
    <template x-if="$store.security.state.report">
        <div class="mode-body" role="tabpanel">
            <section class="w-group" x-show="$store.security.tab === 'Risk'">
                <h3 class="w-group__title" x-text="$store.security.state.report.title"></h3>
                <dl class="w-facts">
                    <template x-for="[key, value] in Object.entries($store.security.state.report.scope || {})" :key="key">
                        <div><dt x-text="key.replaceAll('_', ' ')"></dt><dd x-text="Array.isArray(value) ? value.join(', ') : value"></dd></div>
                    </template>
                    <dt>Runner</dt><dd x-text="$store.security.state.runner === 'host' ? 'Host · real workspace' : 'Container'"></dd>
                </dl>
                <details class="w-disclose" x-show="!$store.security.state.plan_mode">
                    <summary>Execution settings</summary>
                    <p>Docker uses a disposable workspace with network off. Host runs use the real workspace.</p>
                    <button type="button" class="w-textbtn" @click="$store.security.chooseRunner('docker')">Use Docker</button>
                    <button type="button" class="w-textbtn" @click="$store.security.chooseRunner('host')">Enable host for this scan…</button>
                </details>
                <h3 class="w-group__title" x-show="($store.security.state.observations || []).length">Observations</h3>
                <ul class="w-rows">
                    <template x-for="o in ($store.security.state.observations || [])" :key="o.id">
                        <li class="w-row"><div class="w-row__main"><span class="w-row__title" x-text="o.title"></span><span class="w-row__sub" x-text="o.note"></span></div></li>
                    </template>
                </ul>
            </section>
            <section class="w-group" x-show="$store.security.tab === 'Findings'">
                <p class="w-group__empty" x-show="!$store.security.findings().length">No hypotheses recorded.</p>
                <ul class="w-rows">
                    <template x-for="r in $store.security.findings()" :key="r.id">
                        <li class="w-row">
                            <span class="w-sign" :data-status="r.status" aria-hidden="true" x-text="r.glyph"></span>
                            <button type="button" class="w-row__main" @click="$store.security.openFinding(r.raw)"><span class="w-row__title" x-text="r.title"></span><span class="w-row__sub" x-text="r.sub"></span></button>
                            <button type="button" class="w-textbtn" x-show="r.raw.patch_diff" @click="$store.security.openDiff(r.raw)">Diff</button>
                            <button type="button" class="w-textbtn" x-show="!$store.security.state.plan_mode && !['approved', 'refuted'].includes(r.raw.status)" @click="$store.security.handle('refute', { ref: r.id })">Refute…</button>
                        </li>
                    </template>
                </ul>
                <details class="w-disclose" x-show="($store.security.state.runs || []).length">
                    <summary>Run history</summary>
                    <ul class="w-rows">
                        <template x-for="run in ($store.security.state.runs || [])" :key="run.id">
                            <li class="w-row"><button type="button" class="w-row__main" @click="$store.security.openRun(run)"><span class="w-row__title" x-text="$store.security.runRow(run).title"></span><span class="w-row__sub" x-text="run.command"></span></button></li>
                        </template>
                    </ul>
                </details>
            </section>
            <section class="w-group" x-show="$store.security.tab === 'Coverage'">
                <progress class="w-bar" :max="Math.max(1, $store.security.state.report.coverage.total)" :value="$store.security.state.report.coverage.reviewed" aria-label="Surface items reviewed"></progress>
                <p class="w-group__empty">Pattern discovery is a review aid, not exhaustive coverage.</p>
                <ul class="w-rows">
                    <template x-for="item in ($store.security.state.surface || [])" :key="item.id">
                        <li class="w-row"><span class="w-sign" :data-status="window.MuModes.vstyle('security_surface', item.status).status" x-text="window.MuModes.vstyle('security_surface', item.status).glyph"></span><div class="w-row__main"><span class="w-row__title mono" x-text="item.path + ':' + item.line"></span><span class="w-row__sub" x-text="item.note || item.snippet"></span></div></li>
                    </template>
                </ul>
            </section>
            <section class="w-group" x-show="$store.security.tab === 'Report'">
                <p class="w-group__empty" x-show="!$store.security.state.report_markdown">Generate a report to capture findings, coverage, refutations and observations.</p>
                <button type="button" class="w-textbtn" x-show="$store.security.state.report_markdown" @click="$store.security.openReport()">Read report →</button>
            </section>
        </div>
    </template>
</aside>
